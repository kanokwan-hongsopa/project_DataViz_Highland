<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200" preserveAspectRatio="xMidYMin slice">
  <defs>
    <!-- Deep Highland Night-to-Twilight Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061423" />
      <stop offset="28%" stop-color="#0B2239" />
      <stop offset="55%" stop-color="#133854" />
      <stop offset="80%" stop-color="#1A4B6B" />
      <stop offset="100%" stop-color="#102E47" />
    </linearGradient>

    <!-- Distant Wildfire Horizon Glow (Right Ridge) -->
    <radialGradient id="wildfireGlow" cx="82%" cy="22%" r="36%">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.48" />
      <stop offset="35%" stop-color="#E65100" stop-opacity="0.24" />
      <stop offset="70%" stop-color="#8D3B24" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0B2239" stop-opacity="0" />
    </radialGradient>

    <!-- Secondary Warm Ember Glow -->
    <radialGradient id="emberCore" cx="86%" cy="24%" r="16%">
      <stop offset="0%" stop-color="#FFB74D" stop-opacity="0.42" />
      <stop offset="45%" stop-color="#FF5722" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#FF5722" stop-opacity="0" />
    </radialGradient>

    <!-- Cool Cyan Mist Glow (Left/Center Valley) -->
    <radialGradient id="coolMistGlow" cx="28%" cy="26%" r="45%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22" />
      <stop offset="55%" stop-color="#0284C7" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#081B2D" stop-opacity="0" />
    </radialGradient>

    <!-- Mountain Layer Gradients -->
    <linearGradient id="ridgeFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16354D" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0D2336" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="ridgeMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#102A3F" />
      <stop offset="100%" stop-color="#091929" />
    </linearGradient>

    <linearGradient id="ridgeNear" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B1F31" />
      <stop offset="100%" stop-color="#06121E" />
    </linearGradient>

    <!-- Valley Mist Bands -->
    <linearGradient id="mistBand1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CDEFFA" stop-opacity="0" />
      <stop offset="45%" stop-color="#CDEFFA" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#CDEFFA" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="mistBand2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EAF8FE" stop-opacity="0" />
      <stop offset="50%" stop-color="#B6E6F8" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#102E47" stop-opacity="0.05" />
    </linearGradient>

    <!-- Lower Dashboard Atmospheric Backdrop -->
    <linearGradient id="lowerCanopy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A1E30" stop-opacity="0.65" />
      <stop offset="35%" stop-color="#12344D" stop-opacity="0.78" />
      <stop offset="100%" stop-color="#0D263B" stop-opacity="0.92" />
    </linearGradient>

    <!-- Subtle Rain Pattern -->
    <pattern id="rainStreaks" width="120" height="120" patternUnits="userSpaceOnUse" patternTransform="rotate(14)">
      <line x1="20" y1="10" x2="20" y2="38" stroke="#E0F2FE" stroke-width="0.8" stroke-opacity="0.11" />
      <line x1="75" y1="45" x2="75" y2="78" stroke="#BAE6FD" stroke-width="0.7" stroke-opacity="0.09" />
      <line x1="105" y1="80" x2="105" y2="108" stroke="#E0F2FE" stroke-width="0.6" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <!-- Base Sky -->
  <rect width="1920" height="1200" fill="url(#skyGrad)" />

  <!-- Atmospheric Glows -->
  <rect width="1920" height="700" fill="url(#coolMistGlow)" />
  <rect width="1920" height="700" fill="url(#wildfireGlow)" />
  <rect width="1920" height="600" fill="url(#emberCore)" />

  <!-- Distant Highland Range (Doi Inthanon / Chiang Dao Silhouette) -->
  <path d="M0,260 L90,225 L195,240 L310,185 L430,210 L560,155 L690,195 L820,165 L950,210 L1080,175 L1220,140 L1350,185 L1490,150 L1610,190 L1740,145 L1845,175 L1920,160 L1920,520 L0,520 Z" fill="url(#ridgeFar)" />

  <!-- High Valley Mist Layer 1 -->
  <rect x="0" y="185" width="1920" height="110" fill="url(#mistBand1)" />

  <!-- Subtle Distant Wildfire Plume & Ember Haze on Right Mountain Slope -->
  <path d="M1430,235 Q1540,170 1635,195 T1810,165 L1920,190 L1920,310 L1430,310 Z" fill="url(#emberCore)" opacity="0.75" />
  <circle cx="1585" cy="198" r="2.2" fill="#FFAB40" opacity="0.7" />
  <circle cx="1620" cy="186" r="1.8" fill="#FF7043" opacity="0.65" />
  <circle cx="1655" cy="204" r="2.5" fill="#FFA726" opacity="0.6" />
  <circle cx="1540" cy="212" r="1.6" fill="#FFCC80" opacity="0.55" />
  <circle cx="1705" cy="192" r="2.0" fill="#FF8A65" opacity="0.6" />

  <!-- Mid-Ground Mountain Ridges with Northern Pine Forest Texture -->
  <path d="M0,310 L75,285 L165,305 L280,245 L395,275 L510,230 L640,268 L770,225 L895,262 L1035,235 L1160,270 L1295,215 L1420,255 L1555,220 L1690,260 L1810,230 L1920,250 L1920,650 L0,650 Z" fill="url(#ridgeMid)" />

  <!-- Mid Valley Mist Layer 2 -->
  <rect x="0" y="250" width="1920" height="130" fill="url(#mistBand2)" />

  <!-- Foreground Dark Pine Forest & Highland Ridge -->
  <path d="M0,365 L55,342 L120,358 L195,320 L275,350 L360,312 L450,345 L540,318 L630,355 L725,330 L820,360 L920,325 L1015,352 L1115,318 L1215,348 L1320,315 L1425,346 L1530,312 L1635,344 L1735,318 L1835,342 L1920,322 L1920,1200 L0,1200 Z" fill="url(#ridgeNear)" />

  <!-- Lower Canopy & Mist Reflection for Glassmorphism Contrast -->
  <rect x="0" y="370" width="1920" height="830" fill="url(#lowerCanopy)" />
  <rect x="0" y="0" width="1920" height="500" fill="url(#rainStreaks)" />
</svg>
